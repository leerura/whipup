openapi: 3.0.3
info:
  title: WhipUp API
  version: 1.0.0-v4-design
servers:
  - url: /

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Backend is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/guest:
    post:
      tags: [Auth]
      operationId: startGuestSession
      summary: Create a guest account without personal information
      description: >-
        Creates a new account with no personal information and returns the same
        LoginResponse shape as before. The account always starts with terms
        consent required and onboarding incomplete.
      security: []
      responses:
        '200':
          description: Guest account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /api/v1/me:
    get:
      tags: [Auth]
      operationId: getCurrentAccount
      summary: Read the authenticated account state
      description: >-
        Returns the same account state fields as LoginResponse without issuing a
        token. Callable while terms consent is still pending.
      responses:
        '200':
          description: Current account state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Auth]
      operationId: deleteCurrentAccount
      summary: Permanently delete the authenticated account
      description: >-
        Permanently deletes the current user, linked provider accounts, owned
        ingredients, and onboarding state in one transaction. No backup is
        retained. Shared ingredient/catalog and recipe data are not deleted.
        Logout does not exist; after deletion the app starts a new guest account.
      responses:
        '204':
          description: Account deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me/terms-consent:
    post:
      tags: [Auth]
      operationId: acceptTermsConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermsConsentRequest'
      responses:
        '204':
          description: Terms accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me/onboarding:
    post:
      tags: [Onboarding]
      operationId: completeOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '204':
          description: Onboarding completed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/ingredients:
    get:
      tags: [Ingredient]
      operationId: getIngredientGroups
      responses:
        '200':
          description: All registerable ingredient variants grouped for selection UX. Client performs local filtering.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientGroupListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me/ingredients:
    get:
      tags: [OwnedIngredient]
      operationId: getOwnedIngredients
      responses:
        '200':
          description: Owned ingredient variants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedIngredientListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [OwnedIngredient]
      operationId: addOwnedIngredient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOwnedIngredientRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedIngredient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me/ingredients/{userIngredientId}:
    delete:
      tags: [OwnedIngredient]
      operationId: deleteOwnedIngredient
      parameters:
        - name: userIngredientId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/recipes/recommendations:
    get:
      tags: [Recommendation]
      operationId: getRecipeRecommendations
      parameters:
        - name: mode
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/RecommendationMode'
      responses:
        '200':
          description: Recipe recommendations for the selected exploration mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/recipes/search:
    get:
      tags: [Recipe]
      operationId: searchRecipes
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/RecipeSearchScope'
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Published recipes matching the selected scope and query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me/daily-menu:
    get:
      tags: [DailyMenu]
      operationId: getDailyMenu
      responses:
        '200':
          description: Today's menu in most-recently-added order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [DailyMenu]
      operationId: addDailyMenu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyMenuRequest'
      responses:
        '204':
          description: Added (or already present)
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Daily menu storage unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me/daily-menu/{recipeId}:
    delete:
      tags: [DailyMenu]
      operationId: removeDailyMenu
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Removed (or already absent)
        '503':
          description: Daily menu storage unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/recipes/{recipeId}:
    get:
      tags: [Recipe]
      operationId: getRecipeDetail
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Recipe detail projected with current user matching state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/telemetry/http-timing:
    post:
      tags: [Telemetry]
      operationId: recordHttpTiming
      description: Aggregates authenticated client HTTP timing without storing raw events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HttpTimingRequest'
      responses:
        '204':
          description: Timing aggregated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed or missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP

    TermsConsentRequest:
      type: object
      required: [termsVersion, privacyVersion, age14OrOver]
      properties:
        termsVersion:
          type: string
        privacyVersion:
          type: string
        age14OrOver:
          type: boolean

    OnboardingRequest:
      type: object
      required: [variantIds]
      properties:
        variantIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64

    DailyMenuRequest:
      type: object
      required: [recipeId]
      properties:
        recipeId:
          type: integer
          format: int64

    HttpTimingRequest:
      type: object
      required: [route, method, outcome, durationMs]
      properties:
        route:
          type: string
          enum: [/api/v1/auth/guest, /api/v1/me, /api/v1/me/terms-consent, /api/v1/me/onboarding, /api/v1/recipes/recommendations, /api/v1/recipes/search, '/api/v1/recipes/{recipeId}', /api/v1/me/daily-menu, '/api/v1/me/daily-menu/{recipeId}', /api/v1/me/ingredients, '/api/v1/me/ingredients/{userIngredientId}', /api/v1/ingredients]
        method:
          type: string
          enum: [GET, POST, DELETE]
        outcome:
          type: string
          enum: [SUCCESS, CLIENT_ERROR, SERVER_ERROR, NETWORK_ERROR]
        durationMs:
          type: integer
          minimum: 0
          maximum: 60000

    RecipeSearchScope:
      type: string
      enum: [AVAILABLE, ALL]

    LoginResponse:
      type: object
      required: [accessToken, user, hasOwnedIngredients, onboardingCompleted, termsConsentRequired]
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
        hasOwnedIngredients:
          type: boolean
          description: Whether the account currently has any owned ingredient rows.
        onboardingCompleted:
          type: boolean
          description: Whether the account has completed initial ingredient registration. Remains true if all owned ingredients are later deleted.
        termsConsentRequired:
          type: boolean
          description: Whether the account must accept the current terms before using protected APIs.

    CurrentAccountResponse:
      type: object
      required: [user, hasOwnedIngredients, onboardingCompleted, termsConsentRequired]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        hasOwnedIngredients:
          type: boolean
        onboardingCompleted:
          type: boolean
        termsConsentRequired:
          type: boolean

    UserSummary:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer
          format: int64

    IngredientGroupListResponse:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/IngredientGroup'

    IngredientGroup:
      type: object
      required: [name, items]
      properties:
        name:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IngredientVariantOption'

    IngredientVariantOption:
      type: object
      required: [variantId, name]
      properties:
        variantId:
          type: integer
          format: int64
        name:
          type: string

    OwnedIngredient:
      type: object
      required: [userIngredientId, variantId, name]
      properties:
        userIngredientId:
          type: integer
          format: int64
        variantId:
          type: integer
          format: int64
        name:
          type: string

    OwnedIngredientListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OwnedIngredient'

    AddOwnedIngredientRequest:
      type: object
      required: [variantId]
      properties:
        variantId:
          type: integer
          format: int64

    RecommendationMode:
      type: string
      enum: [AVAILABLE, MISSING_INGREDIENTS]

    RecommendationListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationItem'

    RecommendationItem:
      type: object
      required:
        - recipeId
        - name
        - thumbnailUrl
        - missingCount
        - requirementResults
      properties:
        recipeId:
          type: integer
          format: int64
        name:
          type: string
        thumbnailUrl:
          type: string
          format: uri
        missingCount:
          type: integer
          format: int32
          minimum: 0
        requirementResults:
          type: array
          items:
            $ref: '#/components/schemas/RequirementResult'
        sourceChannelName:
          type: string
          nullable: true
          description: Original YouTube channel name, used to tell apart recipes with the same name.
        sourceChannelThumbnailUrl:
          type: string
          format: uri
          nullable: true
          description: Original YouTube channel profile image. Clients fall back to the channel name's first letter.

    RequirementResult:
      oneOf:
        - $ref: '#/components/schemas/SatisfiedRequirementResult'
        - $ref: '#/components/schemas/MissingRequirementResult'
      discriminator:
        propertyName: status
        mapping:
          SATISFIED: '#/components/schemas/SatisfiedRequirementResult'
          MISSING: '#/components/schemas/MissingRequirementResult'

    SatisfiedRequirementResult:
      type: object
      required: [status, matches]
      properties:
        status:
          type: string
          enum: [SATISFIED]
        matches:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IngredientMatch'

    MissingRequirementResult:
      type: object
      required: [status, missingOptions]
      properties:
        status:
          type: string
          enum: [MISSING]
        missingOptions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MissingOption'

    IngredientMatch:
      type: object
      required: [type, requiredName, ownedName]
      properties:
        type:
          type: string
          enum: [DIRECT, PREPARATION, SUBSTITUTE]
        requiredName:
          type: string
        ownedName:
          type: string

    MissingOption:
      type: object
      required: [requiredName, substitutes]
      properties:
        requiredName:
          type: string
          description: Concise missing-item label for recommendation cards. Use the exact selectable item's name when the source ingredient has an exact variant; otherwise use the source requirement display name.
        substitutes:
          type: array
          items:
            $ref: '#/components/schemas/MissingSubstitute'

    MissingSubstitute:
      type: object
      required: [name]
      properties:
        name:
          type: string

    RecipeDetailResponse:
      type: object
      required:
        - recipeId
        - name
        - shortsReference
        - sourceTitle
        - sourceChannelName
        - sourceChannelId
        - sourceMetadataFetchedAt
        - thumbnailUrl
        - missingCount
        - requirements
        - optionalIngredients
        - steps
      properties:
        recipeId:
          type: integer
          format: int64
        name:
          type: string
        shortsReference:
          type: string
          format: uri
        sourceTitle:
          type: string
          nullable: true
          description: Title returned by the stored YouTube source metadata snapshot.
        sourceChannelName:
          type: string
          nullable: true
        sourceChannelId:
          type: string
          nullable: true
        sourceChannelThumbnailUrl:
          type: string
          format: uri
          nullable: true
          description: Original YouTube channel profile image. Clients fall back to the channel name's first letter.
        sourceMetadataFetchedAt:
          type: string
          format: date-time
          nullable: true
          description: UTC time when the stored YouTube metadata snapshot was fetched.
        thumbnailUrl:
          type: string
          format: uri
        missingCount:
          type: integer
          format: int32
          minimum: 0
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/DetailRequirement'
        optionalIngredients:
          type: array
          items:
            $ref: '#/components/schemas/DetailIngredientDisplay'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RecipeStep'

    DetailRequirement:
      oneOf:
        - $ref: '#/components/schemas/SatisfiedDetailRequirement'
        - $ref: '#/components/schemas/MissingDetailRequirement'
      discriminator:
        propertyName: status
        mapping:
          SATISFIED: '#/components/schemas/SatisfiedDetailRequirement'
          MISSING: '#/components/schemas/MissingDetailRequirement'

    SatisfiedDetailRequirement:
      type: object
      required: [status, options, matches]
      properties:
        status:
          type: string
          enum: [SATISFIED]
        options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetailRequirementOption'
        matches:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IngredientMatch'

    MissingDetailRequirement:
      type: object
      required: [status, options]
      properties:
        status:
          type: string
          enum: [MISSING]
        options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetailRequirementOption'

    DetailRequirementOption:
      type: object
      required: [displayName, rawText, substitutes, addableVariants]
      properties:
        displayName:
          type: string
        rawText:
          type: string
        amount:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        substitutes:
          type: array
          items:
            $ref: '#/components/schemas/DetailIngredientDisplay'
        addableVariants:
          type: array
          items:
            $ref: '#/components/schemas/IngredientVariantOption'

    DetailIngredientDisplay:
      type: object
      required: [displayName, rawText]
      properties:
        displayName:
          type: string
        rawText:
          type: string
        amount:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true

    RecipeStep:
      type: object
      required: [order, content]
      properties:
        order:
          type: integer
          format: int32
          minimum: 1
        content:
          type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

security:
  - bearerAuth: []
