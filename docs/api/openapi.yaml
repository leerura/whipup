openapi: 3.0.3
info:
  title: WhipUp API
  version: 1.0.0
servers:
  - url: /api/v1

paths:
  /auth/kakao:
    post:
      tags: [Auth]
      operationId: loginWithKakao
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaoLoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ingredients:
    get:
      tags: [Ingredient]
      operationId: getIngredientOptions
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Ingredient options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientOptionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/ingredients:
    get:
      tags: [OwnedIngredient]
      operationId: getOwnedIngredients
      responses:
        '200':
          description: Owned ingredients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedIngredientListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [OwnedIngredient]
      operationId: addOwnedIngredients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOwnedIngredientsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedIngredientListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/ingredients/{userIngredientId}:
    delete:
      tags: [OwnedIngredient]
      operationId: deleteOwnedIngredient
      parameters:
        - name: userIngredientId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Deleted }
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /recommendations:
    get:
      tags: [Recommendation]
      operationId: getRecommendations
      parameters:
        - name: missingCount
          in: query
          required: true
          schema:
            type: integer
            format: int32
            enum: [0, 1, 2]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /recipes/{recipeId}:
    get:
      tags: [Recipe]
      operationId: getRecipeDetail
      parameters:
        - name: recipeId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Recipe detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 30

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication failed or missing
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    KakaoLoginRequest:
      type: object
      required: [authorizationCode]
      properties:
        authorizationCode: { type: string }

    LoginResponse:
      type: object
      required: [accessToken, user, hasOwnedIngredients]
      properties:
        accessToken: { type: string }
        user:
          $ref: '#/components/schemas/UserSummary'
        hasOwnedIngredients: { type: boolean }

    UserSummary:
      type: object
      required: [userId]
      properties:
        userId: { type: integer, format: int64 }

    IngredientCategory:
      type: object
      required: [categoryId, code, displayName]
      properties:
        categoryId: { type: integer, format: int64 }
        code: { type: string }
        displayName: { type: string }

    IngredientOption:
      type: object
      required: [ingredientId, displayName, categories]
      properties:
        ingredientId: { type: integer, format: int64 }
        ingredientFormId:
          type: integer
          format: int64
          nullable: true
        displayName: { type: string }
        categories:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/IngredientCategory' }

    IngredientOptionPage:
      type: object
      required: [items, page, size, hasNext]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IngredientOption' }
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }
        hasNext: { type: boolean }

    OwnedIngredient:
      type: object
      required: [userIngredientId, ingredientId, displayName]
      properties:
        userIngredientId: { type: integer, format: int64 }
        ingredientId: { type: integer, format: int64 }
        ingredientFormId:
          type: integer
          format: int64
          nullable: true
        displayName: { type: string }

    OwnedIngredientListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OwnedIngredient' }

    AddOwnedIngredientsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OwnedIngredientSelection'

    OwnedIngredientSelection:
      type: object
      required: [ingredientId]
      properties:
        ingredientId: { type: integer, format: int64 }
        ingredientFormId:
          type: integer
          format: int64
          nullable: true

    RecommendationPage:
      type: object
      required: [items, page, size, hasNext]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RecommendationItem' }
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }
        hasNext: { type: boolean }

    RecommendationItem:
      type: object
      required: [recipeId, name, thumbnailUrl, missingCount, missingIngredients]
      properties:
        recipeId: { type: integer, format: int64 }
        name: { type: string }
        thumbnailUrl: { type: string, format: uri }
        missingCount:
          type: integer
          format: int32
          enum: [0, 1, 2]
        missingIngredients:
          type: array
          items:
            $ref: '#/components/schemas/MissingIngredient'

    MissingIngredient:
      type: object
      required: [ingredientId, name]
      properties:
        ingredientId: { type: integer, format: int64 }
        name: { type: string }

    RecipeDetailResponse:
      type: object
      required: [recipeId, name, shortsReference, thumbnailUrl, missingCount, ingredients, steps]
      properties:
        recipeId: { type: integer, format: int64 }
        name: { type: string }
        shortsReference: { type: string, format: uri }
        thumbnailUrl: { type: string, format: uri }
        missingCount: { type: integer, format: int32, minimum: 0 }
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/RecipeIngredient' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/RecipeStep' }

    RecipeIngredient:
      type: object
      required: [recipeIngredientId, ingredientId, displayName, displayOrder, owned]
      properties:
        recipeIngredientId: { type: integer, format: int64 }
        ingredientId: { type: integer, format: int64 }
        ingredientFormId:
          type: integer
          format: int64
          nullable: true
        displayName: { type: string }
        amount:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        displayOrder: { type: integer, format: int32, minimum: 1 }
        owned: { type: boolean }

    RecipeStep:
      type: object
      required: [order, content]
      properties:
        order: { type: integer, format: int32, minimum: 1 }
        content: { type: string }

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

security:
  - bearerAuth: []
