openapi: 3.0.3
info:
  title: WhipUp API
  version: 1.0.0-v2-design
servers:
- url: /
security:
- bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: Backend is healthy
      security: []
      tags:
      - Health
      x-accepts:
      - application/json
      x-tags:
      - tag: Health
  /api/v1/auth/kakao:
    post:
      operationId: loginWithKakao
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KakaoLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          description: Login success
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Authentication failed or missing
      security: []
      tags:
      - Auth
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Auth
  /api/v1/ingredients:
    get:
      operationId: getIngredientGroups
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientGroupListResponse"
          description: All registerable ingredient variants grouped for selection
            UX. Client performs local filtering.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Authentication failed or missing
      tags:
      - Ingredient
      x-accepts:
      - application/json
      x-tags:
      - tag: Ingredient
  /api/v1/me/ingredients:
    get:
      operationId: getOwnedIngredients
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedIngredientListResponse"
          description: Owned ingredient variants
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Authentication failed or missing
      tags:
      - OwnedIngredient
      x-accepts:
      - application/json
      x-tags:
      - tag: OwnedIngredient
    post:
      operationId: addOwnedIngredient
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOwnedIngredientRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedIngredient"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Resource not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request conflicts with current state
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Authentication failed or missing
      tags:
      - OwnedIngredient
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: OwnedIngredient
  /api/v1/me/ingredients/{userIngredientId}:
    delete:
      operationId: deleteOwnedIngredient
      parameters:
      - explode: false
        in: path
        name: userIngredientId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "204":
          description: Deleted
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Resource not found
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Authentication failed or missing
      tags:
      - OwnedIngredient
      x-accepts:
      - application/json
      x-tags:
      - tag: OwnedIngredient
  /api/v1/recipes/recommendations:
    get:
      operationId: getRecipeRecommendations
      parameters:
      - explode: true
        in: query
        name: mode
        required: true
        schema:
          $ref: "#/components/schemas/RecommendationMode"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationListResponse"
          description: Recipe recommendations for the selected exploration mode
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Authentication failed or missing
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request conflicts with current state
      tags:
      - Recommendation
      x-accepts:
      - application/json
      x-tags:
      - tag: Recommendation
  /api/v1/recipes/{recipeId}:
    get:
      operationId: getRecipeDetail
      parameters:
      - explode: false
        in: path
        name: recipeId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetailResponse"
          description: Recipe detail projected with current user matching state
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Authentication failed or missing
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Resource not found
      tags:
      - Recipe
      x-accepts:
      - application/json
      x-tags:
      - tag: Recipe
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Invalid request
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Authentication failed or missing
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Resource not found
    Conflict:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Request conflicts with current state
  schemas:
    HealthResponse:
      example:
        status: UP
      properties:
        status:
          example: UP
          type: string
      required:
      - status
      type: object
    KakaoLoginRequest:
      example:
        kakaoAccessToken: kakaoAccessToken
      properties:
        kakaoAccessToken:
          type: string
      required:
      - kakaoAccessToken
      type: object
    LoginResponse:
      example:
        accessToken: accessToken
        user:
          userId: 0
        hasOwnedIngredients: true
      properties:
        accessToken:
          type: string
        user:
          $ref: "#/components/schemas/UserSummary"
        hasOwnedIngredients:
          type: boolean
      required:
      - accessToken
      - hasOwnedIngredients
      - user
      type: object
    UserSummary:
      example:
        userId: 0
      properties:
        userId:
          format: int64
          type: integer
      required:
      - userId
      type: object
    IngredientGroupListResponse:
      example:
        groups:
        - name: name
          items:
          - variantId: 0
            name: name
          - variantId: 0
            name: name
        - name: name
          items:
          - variantId: 0
            name: name
          - variantId: 0
            name: name
      properties:
        groups:
          items:
            $ref: "#/components/schemas/IngredientGroup"
          type: array
      required:
      - groups
      type: object
    IngredientGroup:
      example:
        name: name
        items:
        - variantId: 0
          name: name
        - variantId: 0
          name: name
      properties:
        name:
          type: string
        items:
          items:
            $ref: "#/components/schemas/IngredientVariantOption"
          minItems: 1
          type: array
      required:
      - items
      - name
      type: object
    IngredientVariantOption:
      example:
        variantId: 0
        name: name
      properties:
        variantId:
          format: int64
          type: integer
        name:
          type: string
      required:
      - name
      - variantId
      type: object
    OwnedIngredient:
      example:
        userIngredientId: 0
        variantId: 6
        name: name
      properties:
        userIngredientId:
          format: int64
          type: integer
        variantId:
          format: int64
          type: integer
        name:
          type: string
      required:
      - name
      - userIngredientId
      - variantId
      type: object
    OwnedIngredientListResponse:
      example:
        items:
        - userIngredientId: 0
          variantId: 6
          name: name
        - userIngredientId: 0
          variantId: 6
          name: name
      properties:
        items:
          items:
            $ref: "#/components/schemas/OwnedIngredient"
          type: array
      required:
      - items
      type: object
    AddOwnedIngredientRequest:
      example:
        variantId: 0
      properties:
        variantId:
          format: int64
          type: integer
      required:
      - variantId
      type: object
    RecommendationMode:
      enum:
      - AVAILABLE
      - MISSING_INGREDIENTS
      type: string
    RecommendationListResponse:
      example:
        items:
        - recipeId: 0
          name: name
          thumbnailUrl: https://openapi-generator.tech
          missingCount: 0
          requirementResults:
          - status: SATISFIED
            matches:
            - type: DIRECT
              requiredName: requiredName
              ownedName: ownedName
            - type: DIRECT
              requiredName: requiredName
              ownedName: ownedName
          - status: SATISFIED
            matches:
            - type: DIRECT
              requiredName: requiredName
              ownedName: ownedName
            - type: DIRECT
              requiredName: requiredName
              ownedName: ownedName
        - recipeId: 0
          name: name
          thumbnailUrl: https://openapi-generator.tech
          missingCount: 0
          requirementResults:
          - status: SATISFIED
            matches:
            - type: DIRECT
              requiredName: requiredName
              ownedName: ownedName
            - type: DIRECT
              requiredName: requiredName
              ownedName: ownedName
          - status: SATISFIED
            matches:
            - type: DIRECT
              requiredName: requiredName
              ownedName: ownedName
            - type: DIRECT
              requiredName: requiredName
              ownedName: ownedName
      properties:
        items:
          items:
            $ref: "#/components/schemas/RecommendationItem"
          type: array
      required:
      - items
      type: object
    RecommendationItem:
      example:
        recipeId: 0
        name: name
        thumbnailUrl: https://openapi-generator.tech
        missingCount: 0
        requirementResults:
        - status: SATISFIED
          matches:
          - type: DIRECT
            requiredName: requiredName
            ownedName: ownedName
          - type: DIRECT
            requiredName: requiredName
            ownedName: ownedName
        - status: SATISFIED
          matches:
          - type: DIRECT
            requiredName: requiredName
            ownedName: ownedName
          - type: DIRECT
            requiredName: requiredName
            ownedName: ownedName
      properties:
        recipeId:
          format: int64
          type: integer
        name:
          type: string
        thumbnailUrl:
          format: uri
          type: string
        missingCount:
          format: int32
          minimum: 0
          type: integer
        requirementResults:
          items:
            $ref: "#/components/schemas/RequirementResult"
          type: array
      required:
      - missingCount
      - name
      - recipeId
      - requirementResults
      - thumbnailUrl
      type: object
    RequirementResult:
      discriminator:
        mapping:
          SATISFIED: "#/components/schemas/SatisfiedRequirementResult"
          MISSING: "#/components/schemas/MissingRequirementResult"
        propertyName: status
      oneOf:
      - $ref: "#/components/schemas/SatisfiedRequirementResult"
      - $ref: "#/components/schemas/MissingRequirementResult"
      x-one-of-name: RequirementResult
    SatisfiedRequirementResult:
      example:
        status: SATISFIED
        matches:
        - type: DIRECT
          requiredName: requiredName
          ownedName: ownedName
        - type: DIRECT
          requiredName: requiredName
          ownedName: ownedName
      properties:
        status:
          enum:
          - SATISFIED
          type: string
        matches:
          items:
            $ref: "#/components/schemas/IngredientMatch"
          minItems: 1
          type: array
      required:
      - matches
      - status
      type: object
    MissingRequirementResult:
      properties:
        status:
          enum:
          - MISSING
          type: string
        missingOptions:
          items:
            $ref: "#/components/schemas/MissingOption"
          minItems: 1
          type: array
      required:
      - missingOptions
      - status
      type: object
    IngredientMatch:
      example:
        type: DIRECT
        requiredName: requiredName
        ownedName: ownedName
      properties:
        type:
          enum:
          - DIRECT
          - PREPARATION
          - SUBSTITUTE
          type: string
        requiredName:
          type: string
        ownedName:
          type: string
      required:
      - ownedName
      - requiredName
      - type
      type: object
    MissingOption:
      properties:
        requiredName:
          type: string
        substitutes:
          items:
            $ref: "#/components/schemas/MissingSubstitute"
          type: array
      required:
      - requiredName
      - substitutes
      type: object
    MissingSubstitute:
      properties:
        name:
          type: string
      required:
      - name
      type: object
    RecipeDetailResponse:
      example:
        recipeId: 0
        name: name
        shortsReference: https://openapi-generator.tech
        thumbnailUrl: https://openapi-generator.tech
        missingCount: 0
        requirements:
        - status: SATISFIED
          options:
          - displayName: displayName
            rawText: rawText
            amount: amount
            unit: unit
            substitutes:
            - displayName: displayName
              rawText: rawText
              amount: amount
              unit: unit
            - displayName: displayName
              rawText: rawText
              amount: amount
              unit: unit
          - displayName: displayName
            rawText: rawText
            amount: amount
            unit: unit
            substitutes:
            - displayName: displayName
              rawText: rawText
              amount: amount
              unit: unit
            - displayName: displayName
              rawText: rawText
              amount: amount
              unit: unit
          matches:
          - type: DIRECT
            requiredName: requiredName
            ownedName: ownedName
          - type: DIRECT
            requiredName: requiredName
            ownedName: ownedName
        - status: SATISFIED
          options:
          - displayName: displayName
            rawText: rawText
            amount: amount
            unit: unit
            substitutes:
            - displayName: displayName
              rawText: rawText
              amount: amount
              unit: unit
            - displayName: displayName
              rawText: rawText
              amount: amount
              unit: unit
          - displayName: displayName
            rawText: rawText
            amount: amount
            unit: unit
            substitutes:
            - displayName: displayName
              rawText: rawText
              amount: amount
              unit: unit
            - displayName: displayName
              rawText: rawText
              amount: amount
              unit: unit
          matches:
          - type: DIRECT
            requiredName: requiredName
            ownedName: ownedName
          - type: DIRECT
            requiredName: requiredName
            ownedName: ownedName
        optionalIngredients:
        - displayName: displayName
          rawText: rawText
          amount: amount
          unit: unit
        - displayName: displayName
          rawText: rawText
          amount: amount
          unit: unit
        steps:
        - order: 1
          content: content
        - order: 1
          content: content
      properties:
        recipeId:
          format: int64
          type: integer
        name:
          type: string
        shortsReference:
          format: uri
          type: string
        thumbnailUrl:
          format: uri
          type: string
        missingCount:
          format: int32
          minimum: 0
          type: integer
        requirements:
          items:
            $ref: "#/components/schemas/DetailRequirement"
          type: array
        optionalIngredients:
          items:
            $ref: "#/components/schemas/DetailIngredientDisplay"
          type: array
        steps:
          items:
            $ref: "#/components/schemas/RecipeStep"
          type: array
      required:
      - missingCount
      - name
      - optionalIngredients
      - recipeId
      - requirements
      - shortsReference
      - steps
      - thumbnailUrl
      type: object
    DetailRequirement:
      discriminator:
        mapping:
          SATISFIED: "#/components/schemas/SatisfiedDetailRequirement"
          MISSING: "#/components/schemas/MissingDetailRequirement"
        propertyName: status
      oneOf:
      - $ref: "#/components/schemas/SatisfiedDetailRequirement"
      - $ref: "#/components/schemas/MissingDetailRequirement"
      x-one-of-name: DetailRequirement
    SatisfiedDetailRequirement:
      example:
        status: SATISFIED
        options:
        - displayName: displayName
          rawText: rawText
          amount: amount
          unit: unit
          substitutes:
          - displayName: displayName
            rawText: rawText
            amount: amount
            unit: unit
          - displayName: displayName
            rawText: rawText
            amount: amount
            unit: unit
        - displayName: displayName
          rawText: rawText
          amount: amount
          unit: unit
          substitutes:
          - displayName: displayName
            rawText: rawText
            amount: amount
            unit: unit
          - displayName: displayName
            rawText: rawText
            amount: amount
            unit: unit
        matches:
        - type: DIRECT
          requiredName: requiredName
          ownedName: ownedName
        - type: DIRECT
          requiredName: requiredName
          ownedName: ownedName
      properties:
        status:
          enum:
          - SATISFIED
          type: string
        options:
          items:
            $ref: "#/components/schemas/DetailRequirementOption"
          minItems: 1
          type: array
        matches:
          items:
            $ref: "#/components/schemas/IngredientMatch"
          minItems: 1
          type: array
      required:
      - matches
      - options
      - status
      type: object
    MissingDetailRequirement:
      properties:
        status:
          enum:
          - MISSING
          type: string
        options:
          items:
            $ref: "#/components/schemas/DetailRequirementOption"
          minItems: 1
          type: array
      required:
      - options
      - status
      type: object
    DetailRequirementOption:
      example:
        displayName: displayName
        rawText: rawText
        amount: amount
        unit: unit
        substitutes:
        - displayName: displayName
          rawText: rawText
          amount: amount
          unit: unit
        - displayName: displayName
          rawText: rawText
          amount: amount
          unit: unit
      properties:
        displayName:
          type: string
        rawText:
          type: string
        amount:
          nullable: true
          type: string
        unit:
          nullable: true
          type: string
        substitutes:
          items:
            $ref: "#/components/schemas/DetailIngredientDisplay"
          type: array
      required:
      - displayName
      - rawText
      - substitutes
      type: object
    DetailIngredientDisplay:
      example:
        displayName: displayName
        rawText: rawText
        amount: amount
        unit: unit
      properties:
        displayName:
          type: string
        rawText:
          type: string
        amount:
          nullable: true
          type: string
        unit:
          nullable: true
          type: string
      required:
      - displayName
      - rawText
      type: object
    RecipeStep:
      example:
        order: 1
        content: content
      properties:
        order:
          format: int32
          minimum: 1
          type: integer
        content:
          type: string
      required:
      - content
      - order
      type: object
    ErrorResponse:
      example:
        code: code
        message: message
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
