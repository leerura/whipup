services:
  recipe-pipeline:
    build:
      context: .
      dockerfile: tools/data-pipeline/Dockerfile
    command: ["python", "/workspace/tools/data-pipeline/src/pipeline.py"]
    environment:
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
      PIPELINE_POLL_SECONDS: ${PIPELINE_POLL_SECONDS:-20}
      PIPELINE_DASHBOARD_PORT: ${PIPELINE_DASHBOARD_PORT:-8081}
    ports:
      - "127.0.0.1:${PIPELINE_DASHBOARD_PORT:-8081}:8081"
    volumes:
      - ./tools/data-pipeline/input:/workspace/tools/data-pipeline/input
      - ./tools/data-pipeline/state:/workspace/tools/data-pipeline/state
      - ./tools/data-pipeline/accounts:/workspace/tools/data-pipeline/accounts:ro

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  https-proxy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      WHIPUP_PUBLIC_IP: ${WHIPUP_PUBLIC_IP:?Set WHIPUP_PUBLIC_IP in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  postgres:
    image: postgres:17.6-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
